services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elms_cloud
      POSTGRES_USER: elms
      POSTGRES_PASSWORD: elms
    ports:
      - "5434:5432"
    volumes:
      - postgres-dev-cloud-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-cloud-data:/data

volumes:
  postgres-dev-cloud-data:
  redis-dev-cloud-data:
