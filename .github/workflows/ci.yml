name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Desktop Rust Formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate
        env:
          COVERAGE_DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_DIFF_HEAD_SHA: ${{ github.sha }}

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/backend/coverage/**
            packages/frontend/coverage/**
            packages/shared/coverage/**
          if-no-files-found: warn

      - name: Coverage Summary
        run: pnpm coverage:summary

      - name: Coverage Hotspots
        run: pnpm coverage:hotspots

      - name: Compile
        run: pnpm compile

  lighthouse:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build frontend
        run: pnpm --filter @elms/frontend build
        env:
          VITE_DISABLE_AUTH_BOOTSTRAP: "true"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          VITE_DISABLE_AUTH_BOOTSTRAP: "true"

  desktop-restore-compat:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        migration_prefix:
          - "0001_"
          - "0010_"
          - "0020_"
          - "0029_"
          - "0034_"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @elms/frontend build
        env:
          VITE_DISABLE_AUTH_BOOTSTRAP: "true"

      - name: Verify migration directory exists in bundled upgrade chain
        run: |
          prefix="${{ matrix.migration_prefix }}"
          if ! find packages/backend/prisma/migrations -maxdepth 1 -type d -name "${prefix}*" | grep -q .; then
            echo "Missing migration directory for prefix ${prefix}. Direct upgrade compatibility window is broken."
            exit 1
          fi
          echo "Found migration directory for prefix ${prefix}"

      - name: Verify frontend dist required by Tauri build exists
        run: |
          if [ ! -f "packages/frontend/dist/index.html" ]; then
            echo "Missing frontend artifact: packages/frontend/dist/index.html"
            echo "Tauri build resources require packages/frontend/dist to exist."
            exit 1
          fi
          echo "Found frontend artifact: packages/frontend/dist/index.html"

      - name: Run desktop restore/forced-migration unit gates
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml desktop_backup::tests:: -- --nocapture
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml sidecar::tests::should_skip_migrations_is_false_after_reset_even_if_schema_is_current -- --nocapture
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml sidecar::tests::reset_cleanup_removes_db_and_migration_markers_when_present -- --nocapture
